# Routes to the in-cluster Kubernetes agent, which advertises `!runner=k8s` — a
# MANDATORY label, so an agent is only eligible when a task asks for it.
labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: pull_request

steps:
  unit:
    image: golang:1.25
    # Resources are REQUIRED. Without them the step pod is QoS class BestEffort,
    # which makes it the first thing the kubelet evicts under node memory
    # pressure — and it dies during `go: downloading`, producing a log with zero
    # `=== RUN` lines that `gh pr checks` renders identically to a real test
    # failure. The tell is the absence of `=== RUN`.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 3Gi }
    commands:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - go vet ./...
      # * -race because the retry path uses a timer and a context, and a data
      # * race there would surface as an intermittent CI failure rather than as
      # * anything a reader would notice.
      - go test -race ./...
      # * The transport seam, asserted rather than remembered.
      # *
      # * internal/mcptools and internal/mcpwrap must not depend on the MCP SDK.
      # * That is what makes the local stdio server evidence about a future
      # * hosted one: the handlers cannot tell which transport called them, so
      # * exercising one exercises both. The day somebody imports the SDK below
      # * the seam for convenience, the seam is gone and nothing would otherwise
      # * notice — the code still builds and every test still passes.
      # *
      # * No shell variables here on purpose: Woodpecker rewrites $$ to $ before
      # * the shell sees the command, and a guard written with indirection has
      # * silently become a no-op in this estate before.
      # * Loaded UNPIPED first. `go list | grep` reports grep's exit status, so a
      # * package that fails to load would sail past the guard below while its
      # * error text — which contains the very module path being searched for —
      # * produced a confusing red for the wrong reason.
      - go list -deps ./internal/mcptools > /dev/null
      - go list -deps ./internal/mcpwrap > /dev/null
      # * Single-quoted as whole YAML scalars. An unquoted command containing
      # * ": " is parsed as a MAPPING, not a string — which is how the first
      # * version of this guard failed the pipeline at compile time rather than
      # * running at all.
      - 'if go list -deps ./internal/mcptools | grep -q modelcontextprotocol/go-sdk; then echo "SEAM BROKEN - internal/mcptools imports the MCP SDK"; exit 1; fi'
      - 'if go list -deps ./internal/mcpwrap | grep -q modelcontextprotocol/go-sdk; then echo "SEAM BROKEN - internal/mcpwrap imports the MCP SDK"; exit 1; fi' 
