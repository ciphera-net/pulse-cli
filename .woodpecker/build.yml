labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: pull_request

steps:
  # * Cross-compile every published target on every PR.
  # *
  # * The alternative is finding out at tag time that a target does not build,
  # * which is the worst moment: the tag is already pushed, and un-tagging a
  # * release people may have started fetching is not a clean operation.
  #
  # * This is also the guard on the keychain backends. go-keyring selects a
  # * different implementation per GOOS — `security` on darwin, D-Bus on linux,
  # * wincred syscalls on windows — and a Linux-only build never compiles two of
  # * the three. A compile failure there would otherwise reach a user before it
  # * reached us.
  cross-compile:
    image: golang:1.25
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 3Gi }
    environment:
      CGO_ENABLED: "0"
    commands:
      - |
        for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
          GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/pulse \
            || { echo "FAILED: $target"; exit 1; }
          echo "ok  $target"
        done

  # * Validate the release configuration on every PR, not at tag time.
  # *
  # * v1.0.0 failed on a schema error — `checksums:` where goreleaser wants
  # * `checksum:` — which cost a tag, a pipeline run and a re-tag. The release
  # * pipeline should not be the first place this config is parsed.
  # *
  # * The prebuilt image rather than `go install`: goreleaser is a large build
  # * and this needs to be cheap enough to run on every pull request. Pinned to
  # * the same version release.yml installs — a check against a different
  # * version validates the wrong schema.
  # *
  # * `check` exits non-zero on DEPRECATIONS as well as errors, and that is now
  # * the whole point of running it.
  # *
  # * This used to grep for the "configuration is valid" line and ignore the exit
  # * code, because `brews` was deliberately deprecated-but-kept. `brews` is gone
  # * (migrated to homebrew_casks, 07-08-2026) and the config is deprecation-free,
  # * so the exit code is trustworthy again — and the grep was not: it printed
  # * "ok" for ANY deprecation, including one scheduled for removal in the very
  # * next goreleaser. Deprecations are how goreleaser gives notice; swallowing
  # * them means the notice arrives as a broken release instead.
  goreleaser-config:
    image: ghcr.io/goreleaser/goreleaser:v2.17.1
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 100m }
          limits: { memory: 1Gi }
    commands:
      - goreleaser check
      - echo "ok  goreleaser config valid, with no deprecated properties"

  # * A release archive that unpacks to a binary which cannot start is a bad
  # * release, and `go test` cannot tell you that — it never links a main. This
  # * runs the real artefact.
  smoke:
    image: golang:1.25
    depends_on: [cross-compile]
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 512Mi, cpu: 250m }
          limits: { memory: 2Gi }
    commands:
      - go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/pulse ./cmd/pulse
      - /tmp/pulse --version
      - /tmp/pulse --help
      # * Every subcommand must at least render its help. A cobra wiring mistake
      # * — a flag registered on the wrong command, a nil sub-command — compiles
      # * cleanly and fails only when someone runs it.
      - |
        for cmd in "auth" "auth login" "auth status" "sites" "sites ls" "stats" "realtime" "export" "export daily" "export pages"; do
          /tmp/pulse $cmd --help > /dev/null || { echo "FAILED: pulse $cmd --help"; exit 1; }
          echo "ok  pulse $cmd --help"
        done
      # * Unauthenticated must exit 3 on EVERY command that reads.
      # *
      # * This step earns its place: it caught two real defects that no unit test
      # * could. This container has no keychain and no config file, which is both
      # * the CI case the tool is meant to serve and a state a developer's macOS
      # * box never reaches.
      # *
      # *   1. go-keyring fails here with "dbus-launch: executable file not
      # *      found", which the CLI reported as an internal error (exit 1).
      # *   2. With no config there is also no default site, and the commands
      # *      resolved the site BEFORE the credential — so they answered "run
      # *      `pulse sites use`", which cannot work without a credential, and
      # *      exited 2 where the honest answer is 3.
      # *
      # * Every read command is covered rather than one, because the ordering bug
      # * was per-command and a single sample would have missed two of three.
      - |
        set +e
        fail=0
        for c in "stats --last 7d" "realtime" "export daily --last 7d" "export pages --last 7d" "sites ls" "auth status"; do
          PULSE_API_KEY="" /tmp/pulse $c >/dev/null 2>&1
          code=$?
          if [ "$code" = "3" ]; then echo "ok  unauthenticated \`pulse $c\` exits 3"
          else echo "FAILED: unauthenticated \`pulse $c\` exited $code, want 3"; fail=1; fi
        done
        [ "$fail" = "0" ] || exit 1
