labels:
  runner: k8s

# Tags only. A release is an explicit act, never a side effect of a push to main.
when:
  - event: tag
    ref: refs/tags/v*

steps:
  release:
    # * The prebuilt goreleaser image, pinned to the same version build.yml
    # * checks the config against.
    # *
    # * It was `golang:1.25` with `go install goreleaser@v2.17.1`, which fails:
    # * goreleaser 2.17.1 requires Go >= 1.26.5 and the image sets
    # * GOTOOLCHAIN=local, so it cannot fetch a newer one. This image already
    # * carries goreleaser 2.17.1, Go 1.26.5 and git — no build step, no version
    # * negotiation, and the tool is pinned by tag rather than resolved at run
    # * time.
    image: ghcr.io/goreleaser/goreleaser:v2.17.1
    backend_options:
      kubernetes:
        resources:
          # Higher than the test step: goreleaser builds six targets in parallel.
          requests: { memory: 2Gi, cpu: 1 }
          limits: { memory: 4Gi }
    environment:
      # * The cosign signing key, held in Vault and exposed to this repo as a
      # * Woodpecker secret. cosign reads it through env:// so it never lands on
      # * disk in the workspace, where a later step or a cached layer could keep
      # * it.
      COSIGN_PRIVATE_KEY:
        from_secret: cosign_private_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      # * Publishes the GitHub release AND pushes the Homebrew formula to
      # * ciphera-net/homebrew-tap, which is a different repository — so this
      # * token needs `repo` on both.
      GITHUB_TOKEN:
        from_secret: release_github_token
      TAP_GITHUB_TOKEN:
        from_secret: release_github_token
    commands:
      # * cosign v2, pinned ahead of the v3 the image ships.
      # *
      # * This is not tidiness. cosign v3 CHANGED THE SIGNING CONTRACT: with
      # * --tlog-upload=false it refuses to run without --bundle
      # * --new-bundle-format, and signatures it does produce are not readable by
      # * the `verify-blob --signature` command this project's README documents.
      # *
      # * Verified inside this exact image before pinning: with v3 the sign step
      # * errors and nothing is written; with v2.4.1 it signs, verifies against
      # * the committed public key, and rejects a modified file.
      # *
      # * Worth noting how this could have shipped silently — a tamper test
      # * "passes" when signing failed entirely, because there is no valid
      # * signature for anything. Any check that a bad input is rejected is
      # * meaningless unless the good input was accepted first.
      - export GOBIN=/tmp/bin
      - go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
      - export PATH=/tmp/bin:$PATH
      # * Assert the pin took, rather than printing it for nobody to read. If the
      # * image's v3 is still first on PATH, every signature this release
      # * publishes would be unverifiable by the command the README gives.
      - |
        v=$(cosign version 2>&1 | grep -i "GitVersion" | head -1)
        echo "$v"
        echo "$v" | grep -q "v2\." || { echo "cosign is NOT v2 — refusing to sign"; exit 1; }
        echo "ok  cosign v2 pinned ahead of the image default"
      # * Fail before building rather than after: a missing secret otherwise
      # * surfaces as a signing error at the very end, with six built archives
      # * and nothing to sign them with.
      # *
      # * Written out one variable at a time, with NO indirection. The first
      # * version looped over names and used `eval "val=\$$v"` — and Woodpecker
      # * substitutes `$$` to `$` before the shell ever sees it, so what actually
      # * ran was `eval "val=\$v"`, which assigns the variable's NAME to val. That
      # * is never empty, so the guard passed unconditionally: a check that looked
      # * like it verified three secrets and verified nothing.
      # *
      # * Three plain lines cannot be eaten by a templating layer.
      - |
        [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "missing required secret: COSIGN_PRIVATE_KEY"; exit 1; }
        [ -n "$COSIGN_PASSWORD" ]    || { echo "missing required secret: COSIGN_PASSWORD"; exit 1; }
        [ -n "$GITHUB_TOKEN" ]       || { echo "missing required secret: GITHUB_TOKEN"; exit 1; }
        [ -n "$TAP_GITHUB_TOKEN" ]   || { echo "missing required secret: TAP_GITHUB_TOKEN"; exit 1; }
        echo "ok  all four secrets present"
      # * Validate the goreleaser config BEFORE building. `check` exits non-zero
      # * on deprecation warnings as well as errors, and `brews` is deliberately
      # * deprecated-but-kept (see .goreleaser.yaml), so the pass condition is the
      # * "configuration is valid" line rather than the exit code. A real schema
      # * error does not produce that line.
      - |
        out=$(goreleaser check 2>&1) || true
        echo "$out"
        echo "$out" | grep -q "configuration is valid" || {
          echo "goreleaser config is INVALID — refusing to build"; exit 1; }
        echo "ok  goreleaser config valid"
      # * Verify the committed public key matches the private key we are about to
      # * sign with, BEFORE producing anything. A mismatch here means every
      # * published signature fails verification against the key the README tells
      # * people to use — and that is discovered by a user, not by us.
      - |
        cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/derived.pub
        if ! diff -q /tmp/derived.pub cosign.pub; then
          echo "cosign.pub in the repo does not match the signing key"
          echo "--- repo:"; cat cosign.pub
          echo "--- derived:"; cat /tmp/derived.pub
          exit 1
        fi
        echo "ok  cosign.pub matches the signing key"
      - goreleaser release --clean
