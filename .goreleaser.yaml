version: 2

project_name: pulse

before:
  hooks:
    - go mod tidy

builds:
  - id: pulse
    main: ./cmd/pulse
    binary: pulse
    # * CGO_ENABLED=0 is what makes this a single static binary with no runtime
    # * for the user to install — the reason the CLI is written in Go at all.
    # * It also keeps the keychain support portable: go-keyring reaches the macOS
    # * Keychain through the `security` tool, libsecret over the session D-Bus,
    # * and the Windows Credential Manager through syscalls. None of it needs cgo,
    # * so cross-compiling all six targets from one machine is honest rather than
    # * a build that merely links.
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # * -s -w strips the symbol table and DWARF: smaller download, and nothing
      # * a debugger needs on a machine that is not ours.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: pulse
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# * Signed with cosign against a key held in Vault and injected by Woodpecker.
# *
# * NOT keyless/Fulcio: keyless needs an OIDC issuer that Fulcio trusts, and the
# * estate runs Woodpecker rather than GitHub Actions — GH Actions was retired
# * org-wide on 10-07-2026. A Vault-held key is the mechanism we can actually
# * operate, and Woodpecker already authenticates to Vault.
# *
# * Both the archives AND checksums.txt are signed. Signing only the archives
# * would leave the checksum file — the thing most people actually verify —
# * unauthenticated.
signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sig"
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
    args:
      - sign-blob
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--output-signature=${signature}"
      # * No upload to the public Rekor transparency log.
      # *
      # * cosign uploads by default, and Rekor is operated in the US — the
      # * standing rule is that no new US service enters the critical path
      # * without explicit sign-off, and a release-signing pipeline is about as
      # * critical as a path gets. Nothing secret would leak (Rekor records the
      # * signature, the public key and a hash, never the artefact), but it would
      # * make every release depend on a service outside the estate.
      # *
      # * The cost is real and worth naming: without a transparency log there is
      # * no public, append-only record that our key signed exactly these
      # * artefacts and nothing else. Verification becomes key-trust alone.
      # * Verified locally: signatures produced this way verify with
      # * --insecure-ignore-tlog=true and still reject a tampered archive.
      - "--tlog-upload=false"
      - "${artifact}"
      - "--yes"

# * `homebrew_casks`, migrated from the deprecated `brews` — and the condition
# * that kept `brews` alive was CHECKED, not assumed, before the switch.
# *
# * The old note here said "casks are macOS-only, a formula covers Linux too, so
# * switching would silently drop brew install for half our users". That was true
# * when it was written and is no longer true. Homebrew 6.0.0 (11-06-2026) landed
# * Linux cask support for portable artifacts, and this cask uses exactly one
# * artifact type — `binary`, which the Cask Cookbook lists as usable on either
# * operating system. Nothing here is macOS-only: no app, no pkg, no
# * `depends_on :macos`.
# *
# * Measured on the generated cask rather than argued from docs (Homebrew 6.0.15,
# * loaded from a local tap):
# *   - the file carries an `on_linux` block with linux_amd64 AND linux_arm64
# *     URLs and checksums, alongside the `on_macos` block;
# *   - `Cask#supports_linux?` returns TRUE, so `brew search`/`info`/`bundle`
# *     advertise it on Linux rather than hiding it;
# *   - under `SimulateSystem.with(os: :linux)` Homebrew resolves the cask to
# *     the linux_amd64 / linux_arm64 archives, not the darwin ones.
# *
# * `binaries:`, not the singular `binary:` — that spelling is itself deprecated
# * and `goreleaser check` fails on it.
homebrew_casks:
  - name: pulse
    # * ciphera-net/homebrew-tap, not ciphera/homebrew-tap. Homebrew resolves
    # * `user/tap` to github.com/user/homebrew-tap, and `ciphera` on GitHub is an
    # * unrelated user account registered in 2016 — so `brew install
    # * ciphera/tap/pulse` was never available to us.
    repository:
      owner: ciphera-net
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://ciphera.net/products/pulse"
    description: "Read your Pulse analytics from the terminal"
    license: "Apache-2.0"
    binaries: [pulse]
    # * There is deliberately NO `conflicts: - formula: pulse` here, and its
    # * absence is not an oversight. goreleaser deprecated that field because
    # * Homebrew removed `conflicts_with formula:` from casks entirely
    # * (Homebrew/brew#20499) — it was a no-op even before that, so writing it
    # * would be a guard that looks like protection and provides none.
    # *
    # * The real guard is deleting Formula/pulse.rb from the tap and adding
    # * tap_migrations.json, which is a MANDATORY part of this migration — see
    # * RELEASING.md, "Migrating the tap". It is not cosmetic: with
    # * Formula/pulse.rb and Casks/pulse.rb both present, measured on Homebrew
    # * 6.0.15, `brew install ciphera-net/tap/pulse` resolves to the FORMULA and
    # * only warns. The cask would be published, ignored, and never installed by
    # * anyone, with no error anywhere to say so.
    # 🔴 WITHOUT THIS HOOK EVERY macOS INSTALL IS DEAD ON ARRIVAL, silently.
    #
    # A cask stages a file downloaded by the browser-equivalent path, so macOS
    # writes com.apple.quarantine onto it. This binary is ad-hoc signed only
    # (`codesign -dv` reports `Identifier=a.out`, no Developer ID), so Gatekeeper
    # REJECTS it — `spctl -a -t exec` says "rejected" and the process is SIGKILLed
    # before main() runs. The user sees exit 137 and no message whatsoever.
    #
    # This was measured on 11-09-2026 against the real published v1.2.0 cask, and
    # it had been broken since v1.1.1 — the release that moved the tap from a
    # formula to a cask. Nobody noticed because the only person testing was still
    # on a formula install from before the migration, and a formula does not carry
    # quarantine. The tap migration fixed a resolution bug and introduced this one.
    #
    # Stripping the attribute is the standard remedy for an unsigned CLI shipped by
    # cask. The real fix is Apple codesigning plus notarisation, which needs a paid
    # Developer ID — that is an owner decision, not a config change, and until it is
    # made this hook is what stands between a release and a binary that cannot run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/pulse"]
          end
    commit_author:
      name: Usman Baig
      email: mubaig@pm.me

release:
  github:
    owner: ciphera-net
    name: pulse-cli
  header: |
    ## pulse {{ .Version }}

    ```bash
    brew install ciphera-net/tap/pulse
    go install github.com/ciphera-net/pulse-cli/cmd/pulse@{{ .Tag }}
    ```

    Verify a downloaded archive:

    ```bash
    cosign verify-blob --key https://raw.githubusercontent.com/ciphera-net/pulse-cli/main/cosign.pub \
      --signature <archive>.sig <archive>
    ```
  footer: |
    **Full changelog**: https://github.com/ciphera-net/pulse-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
